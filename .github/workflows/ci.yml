name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke test against the production server
        run: |
          TPI_DB_PATH="$RUNNER_TEMP/tpi.db" npm start -- -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/healthz && break; sleep 1; done
          npm run smoke
